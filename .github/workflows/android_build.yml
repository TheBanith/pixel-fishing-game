name: Android Build

on:
  push:
    branches: [main]

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Download Godot & Export Templates
        run: |
          GODOT_VERSION=4.3-stable
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION%.*}
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION%.*}

      - name: Create build directory
        run: mkdir -p build

      - name: Run Headless Import
        run: godot --headless --path . --quit

      - name: Export Android Release APK
        run: godot --headless --path . --export-release "Android" build/PixelFishing.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelFishing-Android-Build
          path: build/*.apk
          if-no-files-found: error
