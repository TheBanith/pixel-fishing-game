name: Android Build

on:
  push:
    branches: [main]

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cache the .godot folder to drastically speed up future builds and avoid timeouts
      - name: Cache .godot folder
        uses: actions/cache@v4
        with:
          path: .godot
          key: ${{ runner.os }}-godot-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-godot-

      # Godot requires the export destination folder to exist before exporting
      - name: Create build directory
        run: mkdir -p build

      # Installs JDK 17 + Android SDK, downloads Godot 4.3-stable and its export
      # templates, imports assets headlessly, then runs the export
      - name: Export Android APK
        uses: dulvui/godot-android-export@v4
        with:
          godot-version: 4.3
          godot-channel: stable
          working-directory: .

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelFishing-Android-Build
          path: build/*.apk
          if-no-files-found: error
